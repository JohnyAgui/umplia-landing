<dialog class="film" id="film" aria-label="{{t:film-title}}">
  <div class="film-in">
    <button class="film-close" type="button" data-close aria-label="{{t:close}}">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <video class="film-video" controls preload="none" playsinline width="1920" height="1080" poster="{{a:img/film-poster-1280.jpg}}" data-src-lg="{{film:1080}}" data-src-sm="{{film:720}}"></video>
  </div>
</dialog>
