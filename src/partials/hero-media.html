<div class="hero-media">
  <div class="media-frame">
    {{img:hero-poster|{{t:poster-alt}}|(min-width: 1872px) 1680px, (min-width: 735px) 90vw, 100vw|eager}}
    <video class="hero-video" muted playsinline loop preload="none" width="1920" height="1080" aria-hidden="true" tabindex="-1"
      data-av1-lg="{{loop:1920av1}}" data-h264-lg="{{loop:1920}}" data-av1-sm="{{loop:1280av1}}" data-h264-sm="{{loop:1280}}"></video>
    <button class="vid-toggle" type="button" hidden data-pause="{{t:vid-pause}}" data-play="{{t:vid-play}}" aria-label="{{t:vid-pause}}">
      <svg class="i-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
      <svg class="i-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
    </button>
  </div>
  <p class="sr-only">{{t:vid-desc}}</p>
</div>
